name: CI
on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:
  # Weekly, and on demand, the live tests run as well (PORTUGALINE_LIVE_TESTS
  # below). On push and pull request the suite stays offline, so a network
  # failure cannot turn a code change red.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  PORTUGALINE_LIVE_TESTS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '0' }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1']
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
  converter:
    # scripts/caop_gpkg_to_geojson.py, standard library only. Windows matters:
    # an open SQLite connection locks the GeoPackage there and not on Linux.
    name: GeoPackage converter - Python ${{ matrix.python }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.x']
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s test/python -v
